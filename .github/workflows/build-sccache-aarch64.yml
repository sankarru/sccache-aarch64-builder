name: Build sccache for Android Termux

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-linux-android

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout sccache source
        uses: actions/checkout@v4
        with:
          repository: mozilla/sccache
          path: sccache
          ref: v0.10.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --force

      - name: Build sccache with cross
        working-directory: ./sccache
        run: |
          cross build --release --target ${{ matrix.target }} --features vendored-openssl
          cp target/${{ matrix.target }}/release/sccache ../sccache-android-termux
          chmod +x ../sccache-android-termux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sccache-android-termux
          path: sccache-android-termux

      - name: Get sccache version
        id: version
        run: |
          VERSION=$(cd sccache && git describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sccache version: $VERSION"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
