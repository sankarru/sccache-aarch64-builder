name: Build sccache for aarch64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build sccache with cross
        run: |
          cargo install cross --force
          cross build --release --target ${{ matrix.target }} --manifest-path=~/.cargo/registry/src/*/sccache-*/Cargo.toml
          cp ~/.cargo/target/${{ matrix.target }}/release/sccache sccache-${{ matrix.target }}
          chmod +x sccache-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sccache-${{ matrix.target }}
          path: sccache-${{ matrix.target }}

      - name: Get sccache version
        id: version
        run: |
          VERSION=$(~/.cargo/bin/sccache --version 2>/dev/null || cargo install sccache --force 2>/dev/null && ~/.cargo/bin/sccache --version | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sccache version: $VERSION"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
