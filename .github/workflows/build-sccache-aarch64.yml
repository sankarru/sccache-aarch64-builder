name: Build sccache for Android Termux

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-linux-android

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout sccache source
        uses: actions/checkout@v4
        with:
          repository: mozilla/sccache
          path: sccache
          ref: v0.9.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-android21-clang++" >> $GITHUB_ENV
          echo "AR=aarch64-linux-android21-ar" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build sccache for Android
        working-directory: ./sccache
        run: |
          export CC_aarch64_linux_android=aarch64-linux-android21-clang
          export CXX_aarch64_linux_android=aarch64-linux-android21-clang++
          export AR_aarch64_linux_android=aarch64-linux-android21-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android21-clang
          cargo build --release --target ${{ matrix.target }} --features vendored-openssl
          cp target/${{ matrix.target }}/release/sccache ../sccache-android-termux
          chmod +x ../sccache-android-termux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sccache-android-termux
          path: sccache-android-termux

      - name: Get sccache version
        id: version
        run: |
          VERSION=$(cd sccache && git describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sccache version: $VERSION"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
